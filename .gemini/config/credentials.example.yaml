# ==============================================================================
# OpenShift Credentials Template (EXAMPLE FILE - SAFE TO COMMIT)
# ==============================================================================
# MAPPING MECHANISM:
# 1. Each cluster in clusters.yaml defines: 'env', 'platform', 'flavour'.
# 2. The mapping key is constructed as: <env>-<platform>-<flavour>
#    e.g. 'dev-gcp-managed-cluster' or 'uat-gcp-acm-hub'.
# 3. All clusters sharing the same (<env>, <platform>, <flavour>) inherit the
#    exact same credentials defined below.
#
# Note: ACM Hub clusters are deployed only on GCP. There are no on-prem-acm-hubs.
# ==============================================================================

schema_version: "v1.0"

# Default fallback credentials
default_credentials:
  auth_type: "password"
  username: "l1_operator"
  password: "REPLACE_WITH_DEFAULT_PASSWORD"
  token: ""
  insecure_skip_tls_verify: false

# ------------------------------------------------------------------------------
# Profile Credentials by <env>-<platform>-<flavour>
# ------------------------------------------------------------------------------

# ==============================================================================
# DEVELOPMENT (DEV)
# ==============================================================================
dev-gcp-acm-hub:
  auth_type: "password"
  username: "dev_gcp_hub_admin"
  password: "EXAMPLE_DEV_GCP_HUB_PASSWORD"
  insecure_skip_tls_verify: true

dev-gcp-managed-cluster:
  auth_type: "password"
  username: "dev_gcp_operator"
  password: "EXAMPLE_DEV_GCP_MANAGED_PASSWORD"
  insecure_skip_tls_verify: true

dev-on-prem-managed-cluster:
  auth_type: "password"
  username: "dev_onprem_operator"
  password: "EXAMPLE_DEV_ONPREM_MANAGED_PASSWORD"
  insecure_skip_tls_verify: true

# ==============================================================================
# USER ACCEPTANCE TESTING (UAT)
# ==============================================================================
uat-gcp-acm-hub:
  auth_type: "password"
  username: "uat_gcp_hub_admin"
  password: "EXAMPLE_UAT_GCP_HUB_PASSWORD"
  insecure_skip_tls_verify: false

uat-gcp-managed-cluster:
  auth_type: "password"
  username: "uat_gcp_operator"
  password: "EXAMPLE_UAT_GCP_MANAGED_PASSWORD"
  insecure_skip_tls_verify: false

uat-on-prem-managed-cluster:
  auth_type: "password"
  username: "uat_onprem_operator"
  password: "EXAMPLE_UAT_ONPREM_MANAGED_PASSWORD"
  insecure_skip_tls_verify: false

# ==============================================================================
# PRODUCTION (PROD)
# ==============================================================================
prod-gcp-acm-hub:
  auth_type: "password"
  username: "prod_gcp_hub_admin"
  password: "EXAMPLE_PROD_GCP_HUB_PASSWORD"
  token: "sha256~EXAMPLE_PROD_GCP_HUB_TOKEN"
  insecure_skip_tls_verify: false

prod-gcp-managed-cluster:
  auth_type: "password"
  username: "prod_gcp_operator"
  password: "EXAMPLE_PROD_GCP_MANAGED_PASSWORD"
  token: "sha256~EXAMPLE_PROD_GCP_MANAGED_TOKEN"
  insecure_skip_tls_verify: false

prod-on-prem-managed-cluster:
  auth_type: "password"
  username: "prod_onprem_operator"
  password: "EXAMPLE_PROD_ONPREM_MANAGED_PASSWORD"
  insecure_skip_tls_verify: false
