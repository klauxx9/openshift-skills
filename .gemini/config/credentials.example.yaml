# ==============================================================================
# OpenShift Credentials Template (EXAMPLE FILE - SAFE TO COMMIT)
# ==============================================================================
# INSTRUCTIONS:
# 1. Copy this file to '.gemini/config/credentials.local.yaml'
# 2. Populate your personal credentials or service account tokens.
# 3. Ensure '.gemini/config/credentials.local.yaml' is NEVER removed from .gitignore!
#
# Supported Auth Types:
# - token: OpenShift API Bearer Token (oc login --token=...)
# - password: Username and Password (oc login -u <user> -p <pass>)
# - kubeconfig: Path to a dedicated kubeconfig file
# ==============================================================================

schema_version: "v1.0"

# Default fallback user credentials used across clusters if cluster-specific entry is absent
default_credentials:
  auth_type: "password" # Options: password, token, kubeconfig
  username: "l1_operator"
  password: "REPLACE_WITH_YOUR_PASSWORD"
  token: ""
  insecure_skip_tls_verify: false
  ca_bundle_path: "/etc/pki/ca-trust/source/anchors/enterprise-ca.crt"

# Cluster-specific credentials override
clusters:
  # Development Cluster 01
  ocp-dev-01:
    auth_type: "password"
    username: "l1_dev_user"
    password: "DEV_PASSWORD_HERE"
    insecure_skip_tls_verify: true

  # Development Cluster 02
  ocp-dev-02:
    auth_type: "token"
    token: "sha256~EXAMPLE_DEV2_SERVICE_ACCOUNT_TOKEN"
    insecure_skip_tls_verify: false

  # Staging Cluster 01
  ocp-stg-01:
    auth_type: "password"
    username: "l1_stg_user"
    password: "STG_PASSWORD_HERE"
    insecure_skip_tls_verify: false

  # Production Cluster 01 (Recommended: Use read-only L1 ServiceAccount token or SSO)
  ocp-prd-01:
    auth_type: "token"
    token: "sha256~EXAMPLE_PROD_READONLY_TOKEN"
    kubeconfig_path: "~/.kube/config-ocp-prd-01"
    insecure_skip_tls_verify: false

  # Production Cluster 02 (Baremetal)
  ocp-prd-02:
    auth_type: "password"
    username: "l1_prod_operator"
    password: "PROD_PASSWORD_HERE"
    insecure_skip_tls_verify: false

  # Disaster Recovery Cluster 01
  ocp-dr-01:
    auth_type: "token"
    token: "sha256~EXAMPLE_DR_TOKEN"
    insecure_skip_tls_verify: false

